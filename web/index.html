<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Tuai: claim FoldingCash rewards</title>
    <meta name="description" content="Check and claim FoldingCash rewards with a Merkle proof verified in your browser against the root held on Bitcoin Cash." />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23173f39'/%3E%3Cpath d='M16 26V9M16 14c-4-1-6-4-6-7 4 1 6 3 6 7zm0 4c4-1 6-4 6-7-4 1-6 3-6 7z' stroke='%23d9b23a' stroke-width='2' fill='none'/%3E%3C/svg%3E" />
    <link rel="stylesheet" href="./src/style.css" />
  </head>
  <body>
    <div class="banner" role="note">
      <p><span id="banner-entry"></span> <a id="banner-deck" data-i18n="banner.deck"></a> <span aria-hidden="true">&#183;</span> <a id="banner-repo" data-i18n="bannerSource"></a> <span aria-hidden="true">&#183;</span> <a href="#demo-video" id="banner-video" data-i18n="video.bannerLink"></a><span id="banner-note-dot" aria-hidden="true"> &#183;</span> <a id="banner-note" data-i18n="banner.note"></a></p>
      <p class="banner-prize"><span data-i18n="bannerPrize"></span>: <code id="banner-prize"></code></p>
    </div>
    <header class="top">
      <div class="brand">
        <p class="wordmark" lang="ms">Tuai</p>
        <p class="tagline" data-i18n="tagline"></p>
      </div>
      <button type="button" id="lang" class="lang" lang="ms"></button>
    </header>
    <nav class="views" id="views" data-i18n-label="nav.label">
      <a href="#/" id="nav-claim" data-i18n="nav.claim"></a>
      <a href="#/activity" id="nav-activity" data-i18n="nav.activity"></a>
    </nav>
    <main>
      <h1 class="sr-only" data-i18n="title"></h1>
      <div id="view-claim">
        <section id="hero" class="hero" aria-labelledby="hero-line">
          <p id="hero-line" class="hero-line" data-i18n="hero.line"></p>
          <figure class="hero-figure">
            <svg id="push-pull" viewBox="0 0 320 132" role="img" aria-labelledby="push-pull-title" aria-describedby="push-pull-desc">
              <title id="push-pull-title" data-i18n="hero.figure"></title>
              <desc id="push-pull-desc" data-i18n="hero.figureDesc"></desc>
              <line class="pp-split" x1="160" y1="4" x2="160" y2="128" />
              <g class="pp-push">
                <g class="pp-wires">
            <line x1="80" y1="50" x2="16" y2="112" />
            <line x1="80" y1="50" x2="34" y2="112" />
            <line x1="80" y1="50" x2="52" y2="112" />
            <line x1="80" y1="50" x2="70" y2="112" />
            <line x1="80" y1="50" x2="90" y2="112" />
            <line x1="80" y1="50" x2="108" y2="112" />
            <line x1="80" y1="50" x2="126" y2="112" />
            <line x1="80" y1="50" x2="144" y2="112" />
                </g>
                <rect class="pp-node" x="36" y="30" width="88" height="20" rx="4" />
                <text class="pp-label" x="80" y="44" data-i18n="hero.pushOperator"></text>
                <text class="pp-head" x="80" y="16" data-i18n="hero.push"></text>
                <g class="pp-paid">
            <circle cx="16" cy="118" r="6" style="--i:0" />
            <circle cx="34" cy="118" r="6" style="--i:1" />
            <circle cx="52" cy="118" r="6" style="--i:2" />
            <circle cx="70" cy="118" r="6" style="--i:3" />
            <circle cx="90" cy="118" r="6" style="--i:4" />
            <circle cx="108" cy="118" r="6" style="--i:5" />
            <circle cx="126" cy="118" r="6" style="--i:6" />
            <circle cx="144" cy="118" r="6" style="--i:7" />
                </g>
              </g>
              <g class="pp-pull">
                <rect class="pp-node pp-root" x="186" y="30" width="108" height="20" rx="4" />
                <text class="pp-label pp-root-label" x="240" y="44" data-i18n="hero.pullRoot"></text>
                <text class="pp-head" x="240" y="16" data-i18n="hero.pull"></text>
                <g class="pp-folders">
            <circle cx="176" cy="118" r="6" />
            <circle cx="194" cy="118" r="6" />
            <circle cx="212" cy="118" r="6" />
            <circle cx="230" cy="118" r="6" />
            <circle cx="250" cy="118" r="6" />
            <circle cx="268" cy="118" r="6" />
            <circle cx="286" cy="118" r="6" />
            <circle cx="304" cy="118" r="6" />
                </g>
                <g class="pp-claims">
            <path d="M176 104 V76 M172 81 L176 76 L180 81" style="--i:0" />
            <path d="M194 104 V76 M190 81 L194 76 L198 81" style="--i:1" />
            <path d="M212 104 V76 M208 81 L212 76 L216 81" style="--i:2" />
            <path d="M230 104 V76 M226 81 L230 76 L234 81" style="--i:3" />
            <path d="M250 104 V76 M246 81 L250 76 L254 81" style="--i:4" />
            <path d="M268 104 V76 M264 81 L268 76 L272 81" style="--i:5" />
            <path d="M286 104 V76 M282 81 L286 76 L290 81" style="--i:6" />
            <path d="M304 104 V76 M300 81 L304 76 L308 81" style="--i:7" />
                </g>
              </g>
            </svg>
            <figcaption class="hero-caption">
              <span><strong data-i18n="hero.push"></strong> <span data-i18n="hero.pushCaption"></span></span>
              <span><strong data-i18n="hero.pull"></strong> <span data-i18n="hero.pullCaption"></span></span>
            </figcaption>
          </figure>
          <p class="hero-actions">
            <button type="button" id="hero-try" class="primary" data-i18n="hero.try"></button>
          </p>
          <div class="hero-costs">
            <ul>
              <li id="hero-cost-push" class="cost-push"></li>
              <li id="hero-cost-pull" class="cost-pull"></li>
            </ul>
            <p><a id="hero-costs-link" data-i18n="hero.costsLink"></a></p>
          </div>
        </section>
        <section id="stats" class="stats" aria-labelledby="stats-heading" aria-live="polite">
          <h2 id="stats-heading" class="stats-heading"><span data-i18n="stats.heading"></span> <span id="stats-network" class="stats-network"></span></h2>
          <dl class="stats-tiles">
            <div class="stat" id="stat-leaves"><dt data-i18n="stats.leaves"></dt><dd class="stat-value">&#8212;</dd><dd class="stat-note"></dd></div>
            <div class="stat" id="stat-claims"><dt data-i18n="stats.claims"></dt><dd class="stat-value">&#8212;</dd><dd class="stat-note"></dd></div>
            <div class="stat" id="stat-held"><dt data-i18n="stats.held"></dt><dd class="stat-value">&#8212;</dd><dd class="stat-note"></dd></div>
            <div class="stat" id="stat-cost"><dt data-i18n="stats.cost"></dt><dd class="stat-value">&#8212;</dd><dd class="stat-note"></dd></div>
          </dl>
          <p id="stats-line" class="stats-line"></p>
        </section>
        <section id="mainnet" class="mainnet-card" aria-labelledby="mainnet-heading" hidden>
          <h2 id="mainnet-heading" class="stats-heading" data-i18n="mainnet.heading"></h2>
          <p id="mainnet-count" class="mainnet-count"></p>
          <div id="mainnet-latest" class="mainnet-latest"></div>
          <p class="mainnet-note"><span data-i18n="mainnet.note"></span> <a id="mainnet-activity" data-i18n="mainnet.activity"></a></p>
        </section>
        <section id="demo-video" class="demo-video" aria-labelledby="video-heading">
          <h2 id="video-heading" class="stats-heading" data-i18n="video.heading"></h2>
          <div class="video-frame">
            <video id="video-player" playsinline preload="none" width="1920" height="1080" tabindex="-1" data-i18n-label="video.label"></video>
            <button type="button" id="video-play" class="video-play" data-i18n-label="video.play" hidden>
              <svg viewBox="0 0 64 64" aria-hidden="true" focusable="false"><circle cx="32" cy="32" r="30" /><path d="M26 20v24l19-12z" /></svg>
            </button>
          </div>
          <p class="video-caption"><span data-i18n="video.caption"></span> <a id="video-download" download="tuai-demo.mp4" data-i18n="video.download"></a></p>
        </section>
        <p class="intro" data-i18n="intro"></p>
        <form id="lookup" class="lookup" novalidate>
          <div class="field" id="network-field">
            <label for="network" data-i18n="networkLabel"></label>
            <select id="network"></select>
          </div>
          <div class="field">
            <label for="address" data-i18n="addressLabel"></label>
            <input id="address" name="address" type="text" inputmode="text" autocomplete="off" autocapitalize="none" spellcheck="false" aria-describedby="address-hint" />
            <p id="address-hint" class="hint" data-i18n="addressHint"></p>
          </div>
          <button type="submit" id="check" class="primary" data-i18n="check"></button>
        </form>
        <p class="demo-pick">
          <button type="button" id="demo-pick" class="secondary" data-i18n="relay.demo"></button>
          <span class="hint" data-i18n="relay.demoHint"></span>
        </p>
        <div id="status" role="status" aria-live="polite"></div>
        <section id="result" hidden></section>
        <section id="gate" class="gate" hidden></section>
      </div>
      <section id="view-activity" class="activity" hidden>
        <nav id="activity-networks" class="views net-switch" data-i18n-label="activity.networks" hidden></nav>
        <div id="activity-status" role="status" aria-live="polite"></div>
        <div id="activity"></div>
      </section>
    </main>
    <footer class="foot">
      <a id="link-spec" data-i18n="footer.spec"></a>
      <a id="link-measured" data-i18n="footer.measured"></a>
      <a id="link-source" data-i18n="footer.source"></a>
    </footer>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
