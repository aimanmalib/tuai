# Static claim page and proof files. The CDN in front keeps its own copy of .css/.js for hours, so asset names carry
# a content hash (Vite) and HTML and JSON are sent with short lifetimes and `no-transform`.
client_body_temp_path /tmp/client_body;
proxy_temp_path /tmp/proxy;
fastcgi_temp_path /tmp/fastcgi;
uwsgi_temp_path /tmp/uwsgi;
scgi_temp_path /tmp/scgi;

server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  server_tokens off;
  charset utf-8;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy no-referrer always;

  location = /healthz {
    default_type text/plain;
    add_header Cache-Control "no-store" always;
    return 200 "ok\n";
  }

  # Proof endpoint: any site or CLI may read these files (GET only), and a new epoch shows up within a minute.
  location /epochs/ {
    default_type application/json;
    add_header Cache-Control "public, max-age=60, no-transform" always;
    add_header Access-Control-Allow-Origin "*" always;
    add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
    add_header X-Content-Type-Options nosniff always;
    if ($request_method = OPTIONS) { return 204; }
    limit_except GET HEAD OPTIONS { deny all; }
    try_files $uri =404;
  }

  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header X-Content-Type-Options nosniff always;
    try_files $uri =404;
  }

  location / {
    add_header Cache-Control "no-cache, no-transform" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    try_files $uri /index.html;
  }
}
