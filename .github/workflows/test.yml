# Public test workflow: install with the lockfile and run the full test suite (unit, contract and command line tests).
# Contracts run on the CashScript mock network, so no secrets and no network services are needed.
# The job is skipped while the repository is private, so it uses no runner minutes before publication.
name: Tuai tests
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      NO_COLOR: "1"
      CI: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm test
